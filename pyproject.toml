[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karapincho"
description = "Local, automatic UltraStar karaoke song creator"
dynamic = ["version"]
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Gonzalo Cibeira" }]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "psutil==7.2.2", "numpy>=2.1,<3", "scipy>=1.14,<2", "soundfile>=0.13,<1",
  "pyphen>=0.17,<1", "fugashi>=1.4,<2", "unidic-lite==1.0.8", "pykakasi>=2.3,<3",
  "yt-dlp[default]>=2026.3.3", "av>=19.0.2,<20",
  "brotli>=1.2.1,<2", "certifi>=2026.10.19", "urllib3>=2.8.0,<3",
]

[project.optional-dependencies]
ai = [
  "whisperx>=3.8.4,<3.9", "demucs==4.0.1", "torchcrepe==0.0.24", "transformers>=4.48,<5",
  "aiohttp>=3.14.4,<4", "filelock>=4.2.4,<5", "multidict>=6.9.1,<7", "nltk>=3.10.4,<4",
  "opentelemetry-api>=1.45.1,<2", "opentelemetry-sdk>=1.45.1,<2",
  "opentelemetry-exporter-otlp>=1.45.1,<2", "pillow>=13,<14",
]
gpu = ["mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
       "mlx-qwen3-asr==0.4.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
       "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = [
  "pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1",
  "torch==2.8.0", "torchaudio==2.8.0", "torchcrepe==0.0.24",
  "faster-whisper==1.2.1", "huggingface-hub==0.36.2",
]

[project.urls]
Homepage = "https://github.com/gonzalocibeira/Karapincho"
Repository = "https://github.com/gonzalocibeira/Karapincho"
Documentation = "https://github.com/gonzalocibeira/Karapincho/tree/main/docs"
Issues = "https://github.com/gonzalocibeira/Karapincho/security/advisories/new"

[tool.setuptools.dynamic]
version = { attr = "karapincho.__version__" }

[tool.setuptools.packages.find]
include = ["karapincho*"]

[tool.setuptools.package-data]
karapincho = ["benchmark_assets/*", "model_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
