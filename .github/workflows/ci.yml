name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python checks
        run: python -m pip install -e '.[dev]'
      - name: Verify Python
        run: |
          python -m pip check
          python -m ruff check karapincho tests scripts
          python -m pytest -q
          python scripts/check_release.py
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Install browser
        run: npx --prefix frontend playwright install chromium
      - name: Browser and accessibility smoke tests
        run: npm run test:e2e --prefix frontend
