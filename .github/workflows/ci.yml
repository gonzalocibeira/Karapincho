name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python checks
        run: |
          python -m pip install --upgrade 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
          python -m pip install -e '.[dev]'
      - name: Install maintained FFmpeg
        run: brew install ffmpeg
      - name: Verify Python
        run: |
          python -m pip check
          python -m ruff check karapincho tests scripts
          python -m pytest -q
          python scripts/check_release.py
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run test:runtime --prefix frontend
          npm run build --prefix frontend
          npm audit --prefix frontend
      - name: Install browser
        run: npx --prefix frontend playwright install chromium
      - name: Browser and accessibility smoke tests
        run: npm run test:e2e --prefix frontend
